# ── dotinschool ── HTTPS via an acme.sh-issued certificate (Cloudflare DNS or
# standalone HTTP). Same shape as docker-compose.prod.yml, except Caddy serves
# a certificate file instead of running its own ACME — see build/Caddyfile.acme.
#
# `dotinschool cert <domain>` picks this override automatically when you choose
# the Cloudflare-DNS or standalone method (it writes CERT_MODE=acme to .env).
# The app keeps its plain http://<ip>:<APP_PORT> binding from the base file.
#
#   docker compose -f build/docker-compose.yml -f build/docker-compose.acme.yml up -d

services:
  app:
    environment:
      # Caddy reaches the app from the compose network, so trust its forwarding
      # headers from there — otherwise every visitor shares Caddy's IP and one
      # attacker can use up the login/OTP rate limits for everyone. Published
      # ports on Linux keep the real public source IP, which these private
      # ranges never match, so a direct visitor still can't spoof theirs.
      - TRUSTED_PROXIES=172.16.0.0/12,10.0.0.0/8

  caddy:
    image: caddy:2-alpine
    container_name: dotinschool-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env for the HTTPS setup}
    volumes:
      - ./Caddyfile.acme:/etc/caddy/Caddyfile:ro
      - ../certs/${DOMAIN}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
