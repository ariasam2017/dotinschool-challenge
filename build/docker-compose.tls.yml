# ── dotinschool-challenge ── HTTPS-only, direct TLS. The 3x-ui / sanaei-panel model:
# the app terminates TLS itself on one port, from a certificate acme.sh issued
# (Cloudflare-DNS or standalone-HTTP). No reverse proxy, no plain-HTTP port.
#
# This file is used ALONE (not layered on docker-compose.yml) so there is no
# leftover :8080 publish — the panel is reachable only as https://$DOMAIN/.
# `dotinschool-challenge cert <domain>` writes CERT_MODE=direct to .env and switches to
# this file automatically.
#
#   docker compose --env-file .env -f build/docker-compose.tls.yml up -d
#
# The container runs as a non-root user, so it listens on 8443 inside and the
# host publishes 443 -> 8443 (HTTPS_PORT overrides the host side if 443 is
# taken). Certs live in ../certs/$DOMAIN and acme.sh's cron auto-renews them
# (its --reloadcmd restarts this container).

name: dotinschool-challenge

services:
  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: dotinschool-challenge:local
    container_name: dotinschool-challenge
    ports:
      - "${HTTPS_PORT:-443}:8443"
    environment:
      - PORT=8443
      - DATA_DIR=/app/data
      - DOTINSCHOOL_DOCKER=1
      - SSL_CERT_PATH=/certs/fullchain.pem
      - SSL_KEY_PATH=/certs/privkey.pem
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../data:/app/data
      - ../certs/${DOMAIN:?set DOMAIN in .env}:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:8443/api/config"]
      interval: 30s
      timeout: 4s
      start_period: 5s
      retries: 3
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
