# ── dotinschool ── production override: Caddy in front, automatic HTTPS.
#
# This override ADDS a Caddy reverse proxy that terminates TLS for $DOMAIN and
# fetches + auto-renews a Let's Encrypt certificate on its own (no certbot, no
# acme.sh, no downtime). It deliberately does NOT touch the app's own published
# port: the app stays reachable directly on http://<server-ip>:<APP_PORT> too,
# so the panel is up on the IP the whole time HTTPS is being set up — and stays
# up even if DNS / the ACME challenge isn't ready yet. Caddy reaches the app
# over the compose network (app:8080), which needs no published port at all.
#
# Requirements for the HTTPS side to go green:
#   1. A DNS A record for $DOMAIN pointing at this server's public IP.
#   2. Ports 80 and 443 reachable from the internet.
#   3. DOMAIN set in .env  (e.g. DOMAIN=panel.example.com)
#
# Run:
#   docker compose -f build/docker-compose.yml -f build/docker-compose.prod.yml up -d
#
# With no domain (IP only) just use the base file.

services:
  caddy:
    image: caddy:2-alpine
    container_name: dotinschool-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env for the HTTPS setup}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
