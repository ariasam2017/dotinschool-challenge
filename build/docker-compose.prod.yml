# ── dotinschool-challenge ── production override: Caddy in front, automatic HTTPS.
#
# This override ADDS a Caddy reverse proxy that terminates TLS for $DOMAIN and
# fetches + auto-renews a Let's Encrypt certificate on its own (no certbot, no
# acme.sh, no downtime). In the setup stage plain http://<ip>:<APP_PORT> still
# works; once the HTTPS lock is on the app is reachable ONLY as
# https://$DOMAIN/ (its own port bound to the host's loopback, and plain HTTP
# refused by the app anyway).
#
# Requirements for the HTTPS side to go green:
#   1. A DNS A record for $DOMAIN pointing at this server's public IP.
#   2. Ports 80 and 443 reachable from the internet.
#   3. DOMAIN set in .env  (e.g. DOMAIN=panel.example.com)
#
# Run:
#   docker compose -f build/docker-compose.yml -f build/docker-compose.prod.yml up -d
#
# With no domain (IP only) just use the base file.

services:
  app:
    # Stages (docs/security/TLS-POLICY.md). The installer's .env starts in
    # APP_ENV=setup with APP_BIND=0.0.0.0, so plain http://<ip>:<APP_PORT>
    # still works while HTTPS is checked. "dotinschool-challenge lock on" then
    # sets APP_ENV=production + APP_BIND=127.0.0.1: the app refuses any non-TLS
    # request and answers the admin panel only from ADMIN_ALLOWED_CIDRS, and
    # its port is bound to the host's loopback — the public reaches it solely
    # through Caddy. Both default to the locked values when unset.
    # `!override` needs Docker Compose >= 2.24.4.
    ports: !override
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8081}:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - TLS_PROXY=1
      - ADMIN_ALLOWED_CIDRS=${ADMIN_ALLOWED_CIDRS:-}
      # Trust forwarding headers from Caddy's fixed address ONLY (not the whole
      # Docker range): the visitor IP behind it drives the login/OTP limits.
      - TRUSTED_PROXIES=${EDGE_CADDY_IP:-172.30.57.10}
      - CLIENT_IP_HEADER=X-Forwarded-For
    networks:
      edge:
        ipv4_address: ${EDGE_APP_IP:-172.30.57.20}

  caddy:
    image: caddy:2-alpine
    container_name: dotinschool-challenge-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env for the HTTPS setup}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: ${EDGE_CADDY_IP:-172.30.57.10}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

# A dedicated network with a fixed subnet: exactly two members (Caddy, app),
# fixed addresses, so TRUSTED_PROXIES can name Caddy alone. Change
# EDGE_SUBNET / EDGE_*_IP in .env if the range collides with something else.
networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.57.0/24}
