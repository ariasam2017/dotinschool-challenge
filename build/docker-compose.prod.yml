# ── dotinschool ── production override: Caddy in front, automatic HTTPS.
#
# Requirements:
#   1. A DNS A record for $DOMAIN pointing at this server's public IP.
#   2. Ports 80 and 443 free on the host.
#   3. DOMAIN set in .env  (e.g. DOMAIN=panel.example.com)
#
# Run:
#   docker compose -f build/docker-compose.yml -f build/docker-compose.prod.yml up -d
#
# Caddy fetches + renews the Let's Encrypt certificate on its own — no certbot,
# no acme.sh, no downtime. With no domain (IP only) just use the base file.

services:
  app:
    ports:
      - "127.0.0.1:8080:8080" # not public; Caddy reaches it on the compose network

  caddy:
    image: caddy:2-alpine
    container_name: dotinschool-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env for the HTTPS setup}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
