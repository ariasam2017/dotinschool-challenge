# ── dotinschool ── base stack: works everywhere (Windows/macOS/Linux, IP-only).
#
# The image is built by the packaging Dockerfile (build/Dockerfile), which just
# copies a host-compiled Linux binary — so it never fails on memory / proxy /
# BuildKit. Build it first, then bring the stack up:
#
#   make image                                                   # or: scripts/docker-build.sh
#   docker compose -f build/docker-compose.yml up -d
#   docker compose -f build/docker-compose.yml logs -f app
#   docker compose -f build/docker-compose.yml down
#
# `up -d --build` also works, but only after `dist/dotinschool_linux_amd64`
# exists (make image / scripts/docker-build.sh create it).
#
# Public domain + automatic HTTPS on Linux: add the prod override —
#   docker compose -f build/docker-compose.yml -f build/docker-compose.prod.yml up -d

name: dotinschool

services:
  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: dotinschool:local
    container_name: dotinschool
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - DOTINSCHOOL_DOCKER=1
    env_file:
      - path: ../.env
        required: false
    volumes:
      # ../data (one level up from this file), i.e. the project root's data/ —
      # the same directory the installed CLI's chown targets. Was ./data, which
      # resolves to build/data and left the two out of sync.
      - ../data:/app/data
    # The pure-Go SQLite driver needs a syscall that OLDER Docker's default
    # seccomp profile blocks - inside such a container it fails on startup with
    # "unable to open database file: out of memory (14)" even with plenty of
    # RAM (the same binary run outside Docker on that same host is fine). This
    # drops the seccomp sandbox for this one container down to the same posture
    # as running the trusted binary directly on the host. A newer Docker
    # (its default profile already allows the syscall) does not need it, but
    # keeping it set is harmless there.
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
